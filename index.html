<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#283033" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Design a custom 3D printed door chime cover in a live 3D designer. Ten patterns, fifteen colors, made to your measurements by Express 3D Customs in Windsor, Colorado." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Express 3D Customs | Custom Door Chime Cover Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Start fetching the client's published edits before the app bundle loads (see src/editable.jsx)
      if (!/[?&]bws-edit=/.test(location.search)) {
        window.__BWS_CONTENT__ = fetch("/api/site-content")
          .then(function (response) { return response.ok ? response.json() : null; })
          .catch(function () { return null; });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Page view for the client's portal stats (no cookies; see blueprint-digital api/track.js)
      try {
        navigator.sendBeacon(
          "https://www.blueprintwebstudio.com/api/track",
          JSON.stringify({ path: location.pathname, referrer: document.referrer })
        );
      } catch (error) {}
    </script>
  </body>
</html>
